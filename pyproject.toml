[project]
name = "autohar-researcher"
version = "0.2.0"
description = "Source-validation-guided multi-agent IMU HAR pipeline search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.0", "einops>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
mcp = ["mcp>=1.0"]
whar = ["whar-datasets @ git+https://github.com/teco-kit/whar-datasets.git"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["autohar_researcher*", "research*"]

[project.scripts]
autohar = "autohar_researcher.main:main"
autohar-imugpt-mcp = "autohar_researcher.imugpt_mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"research" = ["baseline_registry.json"]
"research.vendor" = ["*.json", "*.txt"]
